<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy.ai - Starting...</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Outfit', sans-serif;
            background: #07070b;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-app-region: drag;
        }

        /* Ambient background glow */
        .bg-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
        }
        .bg-glow.blue {
            top: -150px;
            left: -150px;
            background: radial-gradient(circle, rgba(59,130,246,0.2) 0%, transparent 70%);
        }
        .bg-glow.cyan {
            bottom: -150px;
            right: -150px;
            background: radial-gradient(circle, rgba(6,182,212,0.15) 0%, transparent 70%);
        }

        .splash-container {
            text-align: center;
            z-index: 10;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Logo pulse ring */
        .logo-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 32px;
        }

        .logo-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: #3b82f6;
            border-right-color: #06b6d4;
            animation: spin 1.5s linear infinite;
        }

        .logo-ring.outer {
            inset: -8px;
            border-top-color: rgba(59,130,246,0.3);
            border-right-color: rgba(6,182,212,0.3);
            animation-duration: 2.5s;
            animation-direction: reverse;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .logo-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border-radius: 16px;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(59,130,246,0.5));
        }

        .app-name {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .app-name span {
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .app-tagline {
            font-size: 0.95rem;
            color: #64748b;
            font-weight: 400;
            margin-bottom: 48px;
        }

        /* Progress bar */
        .progress-container {
            width: 280px;
            margin: 0 auto 20px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 4px;
            background: linear-gradient(90deg, #3b82f6, #06b6d4);
            box-shadow: 0 0 12px rgba(59,130,246,0.5);
            transition: width 0.4s ease;
        }

        /* Status text */
        .status-text {
            font-size: 0.8rem;
            color: #475569;
            font-weight: 400;
            letter-spacing: 0.5px;
            min-height: 20px;
        }

        .status-text .dot-pulse {
            display: inline-block;
            animation: dotPulse 1.4s infinite;
        }
        .status-text .dot-pulse:nth-child(2) { animation-delay: 0.2s; }
        .status-text .dot-pulse:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotPulse {
            0%, 80%, 100% { opacity: 0.2; }
            40% { opacity: 1; }
        }

        /* Error state */
        .error-container {
            display: none;
            margin-top: 24px;
            padding: 16px 24px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 12px;
            max-width: 340px;
            margin-left: auto;
            margin-right: auto;
        }

        .error-container.visible {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        .error-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #ef4444;
            margin-bottom: 6px;
        }

        .error-msg {
            font-size: 0.78rem;
            color: #94a3b8;
            line-height: 1.5;
        }

        .retry-btn {
            margin-top: 12px;
            padding: 8px 24px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            -webkit-app-region: no-drag;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .retry-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(59,130,246,0.4);
        }

        /* Version info */
        .version-info {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.72rem;
            color: #334155;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <div class="bg-glow blue"></div>
    <div class="bg-glow cyan"></div>

    <div class="splash-container">
        <div class="logo-wrapper">
            <div class="logo-ring outer"></div>
            <div class="logo-ring"></div>
            <img src="logo.png" alt="Proxy.ai" class="logo-icon">
        </div>

        <h1 class="app-name">Proxy<span>.ai</span></h1>
        <p class="app-tagline">Face Attendance System</p>

        <div class="progress-container">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <p class="status-text" id="statusText">
            Initializing AI Engine<span class="dot-pulse">.</span><span class="dot-pulse">.</span><span class="dot-pulse">.</span>
        </p>

        <div class="error-container" id="errorBox">
            <div class="error-title">⚠ Backend Failed to Start</div>
            <p class="error-msg" id="errorMsg">The Python AI server could not be reached. Please ensure your system meets the requirements.</p>
            <button class="retry-btn" id="retryBtn" onclick="window.electronAPI?.retry()">Retry</button>
        </div>
    </div>

    <div class="version-info">v1.0.0 · DevSoft Technologies</div>

    <script>
        // Listen for progress updates from main process
        const { ipcRenderer } = require('electron');

        ipcRenderer.on('loading-status', (event, data) => {
            const statusEl = document.getElementById('statusText');
            const progressBar = document.getElementById('progressBar');
            const errorBox = document.getElementById('errorBox');

            if (data.status === 'progress') {
                statusEl.innerHTML = data.message + '<span class="dot-pulse">.</span><span class="dot-pulse">.</span><span class="dot-pulse">.</span>';
                progressBar.style.width = data.percent + '%';
            } else if (data.status === 'ready') {
                statusEl.innerHTML = 'Ready! Launching application...';
                progressBar.style.width = '100%';
            } else if (data.status === 'error') {
                statusEl.innerHTML = '';
                progressBar.style.width = '100%';
                progressBar.style.background = 'linear-gradient(90deg, #ef4444, #dc2626)';
                errorBox.classList.add('visible');
                document.getElementById('errorMsg').textContent = data.message;
            }
        });

        // Retry button
        document.getElementById('retryBtn').addEventListener('click', () => {
            const errorBox = document.getElementById('errorBox');
            const progressBar = document.getElementById('progressBar');
            const statusEl = document.getElementById('statusText');
            
            errorBox.classList.remove('visible');
            progressBar.style.width = '0%';
            progressBar.style.background = 'linear-gradient(90deg, #3b82f6, #06b6d4)';
            statusEl.innerHTML = 'Retrying<span class="dot-pulse">.</span><span class="dot-pulse">.</span><span class="dot-pulse">.</span>';
            
            ipcRenderer.send('retry-backend');
        });
    </script>
</body>
</html>
